name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Nenhum trabalho precisa de escrever no repositório.
permissions:
  contents: read

# Um push novo cancela a verificação anterior do mesmo ramo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Qualidade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Formatação
        run: pnpm run format:check

      - name: Tipos
        run: pnpm run typecheck

      - name: Testes
        run: pnpm run test

      - name: Build
        run: pnpm run build

  seguranca:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditar dependências
        run: pnpm audit --audit-level=high
